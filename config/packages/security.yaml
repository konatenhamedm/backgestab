security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    role_hierarchy:
        ROLE_GESTIONNAIRE: [ROLE_EMPLOYE]
        ROLE_COMPTABLE: [ROLE_EMPLOYE]
        ROLE_ADMIN: [ROLE_GESTIONNAIRE, ROLE_COMPTABLE]
        ROLE_SUPER_ADMIN: [ROLE_ADMIN]

    providers:
        app_user_provider:
            entity:
                class: App\Security\Domain\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        home:
            pattern: ^/$
            security: false

        api_doc:
            pattern: ^/api/doc
            security: false

        auth_public:
            pattern: ^/api/(login|auth/(register|forgot|reset))
            stateless: true
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\Infrastructure\Security\UserChecker
            custom_authenticators:
                - App\Security\Infrastructure\Security\JwtAuthenticator
            entry_point: App\Security\Infrastructure\Security\JwtAuthenticator

    access_control:
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
